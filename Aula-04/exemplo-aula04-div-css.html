<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>
    <style>
        div{
            font-size: 20px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color: pink;
            border: 2px solid blue;
            color: white
        }
        #secundaria{
            background-color: gold;
            border: 2px solid black;
            color: red
        }
        hr{
            border: none;
            border-top: 3px solid pink;
            width: 90%;
        }
    </style>
</head>
<body>
    <div id = "principal">
        Esta é a primeira linha
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id = "secundaria">
        Esta é a nova divisão da pagina.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
