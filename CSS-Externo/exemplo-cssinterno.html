<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estudando Classes em CSS</title>
    
    <style>
        .titulo{
            color: darkorange;
            text-align: center;
        }
        
        .caixa01{
            background-color: bisque;
            border: 2px solid darkcyan;
            border-radius: 25px;
            padding: 20px;
            margin: 20px;
        }
        
        .caixa02{
            background-color: darkgreen;
            border: 2px solid black;
            padding: 20px;
            border-radius: 25px;
            margin: 20px;
        }
        .paragrafo01{
            color: darkred;
            font-weight: bold;
        }
        .paragrafo02{
            color: pink;
            background-color: black;
            font-style: oblique;
            padding: 10px;
        }




    </style>

</head>

<body>

    <h1 class="titulo">Aprendendo Classes em CSS</h1>

    <div class="caixa01">
        <p class="paragrafo01">Salve.</p>
        <p class="paragrafo02">Este é o segundo parágrafo.</p>
    </div>

    <div class="caixa02">
        <p class="texto">Este é o terceiro parágrafo.</p>
    </div>

</body>
</html>
